<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIS LLM Test • ClassiFy AI</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="simplebody"><div class="simple"><a href="/" class="back">← Back to command center</a><span class="tag">SYSTEM DIAGNOSTIC</span><h1>CIS LLM connectivity test</h1><p>Use this before a production run to verify the CIS endpoint, API key and <b>hack-fest-gpt-5.6-luna</b> deployment.</p><button id="test">RUN LLM TEST →</button><div id="result" class="testresult">Ready.</div></div><script>document.getElementById('test').onclick=()=>{const b=document.getElementById('test'),r=document.getElementById('result');b.disabled=true;b.textContent='TESTING…';fetch('/api/llm-test',{method:'POST'}).then(x=>x.json()).then(d=>{r.className='testresult '+(d.ok?'ok':'bad');r.innerHTML=d.ok?`✓ CONNECTED<br><small>Model: ${d.model}<br>Latency: ${d.latency_ms} ms<br>Response: ${d.response}</small>`:`✕ NOT CONNECTED<br><small>${d.error||'No response from CIS LLM'}</small>`;b.disabled=false;b.textContent='RUN AGAIN →'}).catch(e=>{r.className='testresult bad';r.textContent=e;b.disabled=false})}</script></body></html>
